# ==============================================================================
# FALCONX FLY.IO 1-CLICK DEPLOYMENT CONFIG
# ==============================================================================

app = "falconx-cluster"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "7860"
  HEADLESS = "true"
  MAX_CONCURRENT_BROWSERS = "2"
  DASHBOARD_HOST = "0.0.0.0"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "30s"
  interval = "15s"
  method = "GET"
  timeout = "5s"
  path = "/healthz"
